# Eval cases for the synthetic corpus (gen.py). Item ids: tomoe:<session id>,
# calendar:eN, mail:mN, chat:cN. Meetings T1..T8 are tomoe:11111111-0000-4000-8000-00000000000N.
#
# Kinds:
#   search   expect: any target in top k (default 5); forbid: none at any depth
#   leak     a search under a narrow scope; forbid is the point, expect checks
#            that open material still comes through
#   classify the chunk containing target.contains has exactly level/categories
#   resolve  the mention `surface` in that chunk resolves to `entity`
#            ("ambiguous" or "none" allowed)
#   graph    entity neighbours and items under a scope

# Every search/leak query is also run under these scopes for the invariant check.
probe_scopes = ["shared-screen", "cloud", "reply:lee.chen@northwind.example", "reply:tom.becker@acmefreight.example", "reply:nina.patel@bluegill.example"]

# ---------- retrieval (owner) ----------

[[case]]
id = "S01"
kind = "search"
query = "why did search latency regress"
expect = [{ item = "tomoe:11111111-0000-4000-8000-000000000001", contains = "index migration" }]

[[case]]
id = "S02"
