# ---------- resolution ----------

[[case]]
id = "R01"
kind = "resolve"
note = "first name only, not a participant, unique in the registry"
target = { item = "tomoe:11111111-0000-4000-8000-000000000004", contains = "Nina" }
surface = "Nina"
entity = "person:nina.patel@bluegill.example"

[[case]]
id = "R02"
kind = "resolve"
target = { item = "chat:c1", contains = "Whitfield" }
