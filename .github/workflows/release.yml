name: release
# Builds Musubi.dmg (the app with its recorder inside) on a macOS runner.
# A version tag (v1.2.3) publishes it as a GitHub release; running the
# workflow by hand, or a pull request that changes the packaging, only
# keeps the DMG as a build artifact.
# Signed with a self-signed certificate (secrets MUSUBI_SIGNING_P12 and
# MUSUBI_SIGNING_PASSWORD), not a Developer ID, so macOS asks to confirm
# the first open (docs/user-guide.md, "Install").
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Makefile, "packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Signed with the self-signed "Musubi Release Signing" certificate,
      # so every release has the same identity and macOS keeps the
      # recorder's permissions across updates (ad hoc, each build is a new
      # app to it). Not a Developer ID: the first open still needs "Open
      # Anyway". Without the secrets (a fork, a PR) it signs ad hoc.
      - name: Load the signing certificate
        id: sign
        env:
          P12: ${{ secrets.MUSUBI_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MUSUBI_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::no signing certificate; signing ad hoc"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="$(security find-identity -p codesigning "$kc" | awk '/Musubi Release Signing/ {print $2; exit}')"
          [ -n "$id" ] || { echo "::error::the certificate has no Musubi Release Signing identity"; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"
      - name: Build the DMG
        run: make dmg CODESIGN_IDENTITY="${{ steps.sign.outputs.identity }}" RECORDER_IDENTITY="${{ steps.sign.outputs.identity }}" CHANNEL=release
      - uses: actions/upload-artifact@v4
        with:
          name: musubi-dmg
          path: |
            build/Musubi-*.dmg
            build/Musubi-*.dmg.sha256
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v1.2.0-rc1) is a release candidate: a
        # pre-release, which runs on our own dataset first
        # (docs/releasing.md).
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/Musubi-*.dmg --title "Musubi $GITHUB_REF_NAME" --generate-notes $pre
      # The same DMG and its checksum on the public releases-only
      # repository, which the app's update check reads and installs from
      # ([updates]). Only those and a fixed line go there: notes stay
      # here, as they name PRs and docs. Needs RELEASED_TOKEN
      # (fine-grained, Contents: write on that repository).
      - name: Publish the DMG for the update check
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASED_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASED_TOKEN is not set; the update check won't see $GITHUB_REF_NAME"
            exit 0
          fi
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/Musubi-*.dmg build/Musubi-*.dmg.sha256 -R anielsud/musubi-releases \
            --title "Musubi $GITHUB_REF_NAME" --notes "Musubi $GITHUB_REF_NAME for macOS." $pre
